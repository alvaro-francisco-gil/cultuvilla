<!DOCTYPE html>
<!--
  The web build's document template. With web.output 'single', Expo builds
  dist/index.html from THIS file and ignores app/+html.tsx entirely — which is
  how a lang="es" fix and the iOS App Store tag once sat dead in production.
  scripts/check-web-export.mjs rejects a deploy whose export lacks either.
  The page title placeholder is filled from the app name per env — and Expo
  replaces only its FIRST occurrence, so never write the placeholder anywhere
  above the title, this comment included. ogRenderer drops these comments and
  replaces the title/description/og/twitter tags on share-link routes.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Fiestas, eventos, noticias y vida de los pueblos de España. Descubre lo que pasa en tu pueblo y apúntate."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cultuvilla" />
    <meta property="og:title" content="Cultuvilla — la vida de tu pueblo" />
    <meta
      property="og:description"
      content="Fiestas, eventos, noticias y vida de los pueblos de España."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Safari on iOS draws its own install bar from this; SmartAppBanner
         stands down there because of it. The id must equal APP_STORE_ID in
         lib/appStores.ts (asserted by lib/__tests__/webDocument.test.ts). -->
    <meta name="apple-itunes-app" content="app-id=6804756586" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar Cultuvilla.</noscript>
    <div id="root"></div>
  </body>
</html>
