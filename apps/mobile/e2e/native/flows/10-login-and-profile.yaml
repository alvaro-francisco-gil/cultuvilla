# Proves the native fixture-login seam and the signed-in read chain on device:
# deep link -> signInWithEmailAndPassword against the Auth emulator -> users/{uid}
# -> persons/{id} -> rendered profile. Everything below depends on this working,
# so it runs first among the authenticated flows and fails loudly on its own.
#
# It also covers what NO web flow can: RN's Linking intent delivery, AsyncStorage
# auth persistence, and the native Firestore SDK path.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-user@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
---
# `clearState` + cold-start openLink live in the login subflow — see the note
# there on why a launchApp-then-openLink sequence drops the login intent.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
# The seeded attendee's display name — proof the persons doc, not just the auth
# session, made it to the screen. Mirrors scripts/data/seed-fixtures/e2e/fixtures.mjs.
# Maestro's text selector matches the WHOLE string, so this is the full name.
- assertVisible: 'Usuario E2E'
# The dependent persona the family-member flow signs up, rendered from the same
# profile read — so 21's precondition is verified here rather than there.
- assertVisible: 'Lucía Dependiente'
