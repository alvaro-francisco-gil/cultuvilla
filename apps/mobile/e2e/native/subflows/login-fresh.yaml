# Same seam and the same cold-start reasoning as login.yaml, but for an
# auth-only fixture account with no profile. There is no `profile-edit-action`
# to wait on — the AuthGate diverts to complete-profile instead — so the
# assertion is that screen's first field, which doubles as the proof that the
# divert happened.
appId: com.cultuvilla.app.dev
---
- clearState
- openLink: 'cultuvilla://?e2eLogin=${EMAIL}%7C${PASSWORD}'
- extendedWaitUntil:
    visible:
      id: 'person-given-name'
    timeout: 90000
