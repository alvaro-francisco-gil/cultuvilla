name: mobile-release

# Builds the store binaries on EAS and hands them to Google Play / App Store
# Connect. Manual-only on purpose: the Play track a build lands on is a release
# decision (a closed test that has to run 14 days is not the same event as a
# production rollout), so it stays an explicit choice rather than a side effect
# of merging to main.
#
# Every track builds from the SAME `production` EAS profile — prod Firebase,
# package com.cultuvilla.app. Play's closed-testing requirement is per package
# name, so testing on the `com.cultuvilla.app.beta` build would NOT count toward
# production access for `com.cultuvilla.app`. Promote one artifact across tracks
# instead of building a different app per track.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store binary to build
        type: choice
        options: [android, ios, all]
        default: android
      track:
        description: 'Play track (android only): internal = fast smoke test, closed = starts the 14-day clock, production = public'
        type: choice
        options: [internal, closed, production]
        default: internal
      submit:
        description: Submit the build to the store after it succeeds
        type: boolean
        default: true
      testflightGroup:
        description: 'iOS only: TestFlight internal testing group to add the build to (leave blank to skip — the build still lands in App Store Connect either way)'
        type: string
        default: ''

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android (build${{ inputs.submit && format(' + submit -> {0}', inputs.track) || '' }})
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The mobile app resolves @cultuvilla/shared through the package's built
      # dist/, which is gitignored — EAS uploads the working tree as-is, so an
      # unbuilt shared package fails on the build server, not here.
      - name: Build shared package
        run: pnpm shared:build

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json points submit at ./google-play-service-account.json (relative to
      # apps/mobile). Gitignored via the repo-wide *service-account*.json rule;
      # materialised here from the secret and never persisted.
      - name: Write Google Play service account key
        if: ${{ inputs.submit }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set — cannot submit to Play."
            exit 1
          fi
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > apps/mobile/google-play-service-account.json

      - name: Show EAS remote version counters
        working-directory: apps/mobile
        run: eas build:version:get --platform android --profile production --non-interactive

      - name: Build Android app bundle${{ inputs.submit && ' and submit' || '' }}
        working-directory: apps/mobile
        run: |
          eas build \
            --profile production \
            --platform android \
            --non-interactive \
            --wait \
            ${{ inputs.submit && format('--auto-submit-with-profile {0}', inputs.track) || '' }}

      - name: Remove service account key
        if: ${{ always() }}
        run: rm -f apps/mobile/google-play-service-account.json

  ios:
    name: iOS (build${{ inputs.submit && format(' + submit -> TestFlight{0}', inputs.testflightGroup != '' && format(' [{0}]', inputs.testflightGroup) || '') || '' }})
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ascAppId/ascApiKeyId/ascApiKeyIssuerId only exist once the App Store Connect
      # app record and API key are created, and eas submit --non-interactive cannot
      # discover them. Fail here with a readable message rather than 40 minutes
      # later at the submit step.
      - name: Assert App Store Connect app is configured
        if: ${{ inputs.submit }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          missing=()
          [ -z "${ASC_APP_ID}" ] && missing+=("ASC_APP_ID")
          [ -z "${APPLE_ASC_KEY_ID}" ] && missing+=("APPLE_ASC_KEY_ID")
          [ -z "${APPLE_ASC_ISSUER_ID}" ] && missing+=("APPLE_ASC_ISSUER_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo variable(s): ${missing[*]} — create the app in App Store Connect and the ASC API key before submitting iOS."
            exit 1
          fi

      # eas.json points ascApiKeyPath at ./apple-asc-api-key.p8 (relative to
      # apps/mobile). Gitignored via the repo-wide *api-key*.p8 rule; materialised
      # here from the secret and never persisted. ascApiKeyId/ascApiKeyIssuerId are
      # not secret (they only identify which key), but they don't exist until the
      # key is created in App Store Connect, so eas.json can't commit real values —
      # patched into the submit profile at runtime instead.
      - name: Write App Store Connect API key
        if: ${{ inputs.submit }}
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_ASC_API_KEY_P8}" ]; then
            echo "::error::APPLE_ASC_API_KEY_P8 secret is not set — cannot submit to App Store Connect."
            exit 1
          fi
          printf '%s' "${APPLE_ASC_API_KEY_P8}" > apps/mobile/apple-asc-api-key.p8
          node -e "
            const fs = require('fs');
            const path = 'apps/mobile/eas.json';
            const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
            eas.submit.production.ios.ascApiKeyId = process.env.APPLE_ASC_KEY_ID;
            eas.submit.production.ios.ascApiKeyIssuerId = process.env.APPLE_ASC_ISSUER_ID;
            fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');
          "

      - name: Build iOS archive
        working-directory: apps/mobile
        run: eas build --profile production --platform ios --non-interactive --wait

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        run: |
          eas submit \
            --profile production \
            --platform ios \
            --latest \
            --non-interactive \
            ${{ inputs.testflightGroup != '' && format('--groups "{0}"', inputs.testflightGroup) || '' }}

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f apps/mobile/apple-asc-api-key.p8
