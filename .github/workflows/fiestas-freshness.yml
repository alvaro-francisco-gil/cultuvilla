# Is the fiestas research still current?
#
# Deliberately NOT part of `pnpm check`. Staleness trips on a calendar boundary
# rather than on a diff, so gating PRs would red `develop` in October for
# something nobody in that PR did. This opens an issue instead, which is what a
# "somebody should go and look" signal actually is.
name: Fiestas freshness

on:
  schedule:
    - cron: '0 7 1 * *' # 07:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shared:build

      - name: Check dataset freshness
        id: check
        run: |
          set +e
          OUT=$(pnpm --silent fiestas:verify --strict 2>&1)
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<REPORT'
            echo "$OUT"
            echo 'REPORT'
          } >> "$GITHUB_OUTPUT"
          echo "$OUT"

      # The report reaches the script through the environment, NEVER through
      # `${{ }}` interpolation: it is free text that contains backticks (it names
      # `research-village-fiestas`), which would close the template literal and
      # fail the script with a syntax error — precisely on the stale runs this
      # job exists for.
      - name: Open or update the refresh issue
        if: steps.check.outputs.exit != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const report = process.env.REPORT ?? '';
            const body = [
              'El boletín provincial ya debería haber publicado las fiestas locales del año siguiente.',
              '',
              '~~~',
              report,
              '~~~',
              '',
              'Para refrescarlo: usa la skill `research-village-fiestas`, o lanza el agente `mercado-scout`.',
            ].join('\n');
            const title = 'Refrescar las fiestas declaradas (nuevo BOP publicado)';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fiestas-freshness',
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['fiestas-freshness'],
              });
            }
