# Is the opportunity search still current?
#
# Same posture and same shape as fiestas-freshness.yml, and for the same reason:
# a sweep coming due trips on a calendar boundary rather than on a diff, so
# gating PRs would red `develop` for something nobody in that PR did. This opens
# an issue instead, which is what a "somebody should go and look" signal is.
#
# Weekly rather than monthly: a funding call appears and closes inside a month,
# unlike a provincial bulletin that publishes once a year.
name: Búsquedas freshness

on:
  schedule:
    - cron: '0 7 * * 1' # 07:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check whether a sweep is due
        id: check
        run: |
          set +e
          OUT=$(pnpm --silent opportunities:verify --strict 2>&1)
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<REPORT'
            echo "$OUT"
            echo 'REPORT'
          } >> "$GITHUB_OUTPUT"
          echo "$OUT"

      # The report reaches the script through the environment, NEVER through
      # `${{ }}` interpolation: it is free text containing backticks (it names
      # `research-opportunities`), which would close the template literal and fail
      # the script with a syntax error — precisely on the runs this job exists for.
      - name: Open or update the sweep issue
        if: steps.check.outputs.exit != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const report = process.env.REPORT ?? '';
            const body = [
              'Toca volver a barrer convocatorias: la fecha de `revisar` del último barrido ya ha pasado.',
              '',
              '~~~',
              report,
              '~~~',
              '',
              'Para hacerlo: usa la skill `research-opportunities`, o lanza el agente `opportunity-scout`.',
              'El barrido termina escribiendo una ficha nueva en `project/busquedas/`, con lo que se buscó,',
              'lo que no dio nada, y la siguiente fecha de revisión.',
            ].join('\n');
            const title = 'Barrido de convocatorias vencido';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'busquedas-freshness',
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['busquedas-freshness'],
              });
            }
