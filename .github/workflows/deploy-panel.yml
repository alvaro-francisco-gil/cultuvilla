name: Deploy Panel

# The internal founders' panel (apps/panel) — NOT the app. It deploys to its own
# hosting target on the dev project only, so it has no release path and cannot
# affect a promotion. It is a separate workflow rather than a step in
# deploy-firebase.yml for exactly that reason: a broken panel build must never
# block the app from shipping.
#
# It deliberately declares the `dev` GitHub Environment only, and runs on pushes
# to develop that touch the registry or the panel — the panel's content IS the
# registry, so a new convocatoria should reach it without anybody remembering.

on:
  push:
    branches: [develop]
    paths:
      - 'project/**'
      - 'apps/panel/**'
      - 'scripts/generate-business-snapshot.mjs'
      - 'scripts/lib/business-snapshot.mjs'
      - 'packages/shared/src/models/business/**'
      - '.github/workflows/deploy-panel.yml'
  workflow_dispatch:

concurrency:
  group: deploy-panel
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy panel to dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The snapshot is committed, and CI already fails if it is stale — this
      # regenerates anyway so a deploy can never publish an older one than the
      # commit it is building.
      - name: Regenerate the business snapshot
        run: pnpm business:snapshot

      - name: Build the panel
        run: pnpm panel:build
        env:
          FIREBASE_API_KEY_DEV: ${{ vars.FIREBASE_API_KEY_DEV }}
          FIREBASE_AUTH_DOMAIN_DEV: ${{ vars.FIREBASE_AUTH_DOMAIN_DEV }}
          FIREBASE_PROJECT_ID_DEV: ${{ vars.FIREBASE_PROJECT_ID_DEV }}
          FIREBASE_APP_ID_DEV: ${{ vars.FIREBASE_APP_ID_DEV }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      # The callable that serves the snapshot lives in functions, so the panel's
      # data only changes once that is redeployed. Hosting alone would publish a
      # shell that still reads yesterday's registry.
      - name: Deploy the snapshot callable
        run: firebase deploy --only functions:getBusinessSnapshot --project dev --non-interactive

      - name: Deploy the panel
        run: firebase deploy --only hosting:panel --project dev --non-interactive
